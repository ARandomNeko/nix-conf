# Noctalia Material 3 theme for tmux
# Generated from the active wallpaper. Changes to this file are overwritten.

set -g status-style "bg={{colors.surface.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g status-left-length 64
set -g status-right-length 120
set -g status-left "#[bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold] 󰒋 #H #[bg={{colors.surface_container_high.default.hex}},fg={{colors.primary.default.hex}}]#[fg={{colors.on_surface.default.hex}},bold] 󰆍 #S #[bg={{colors.surface.default.hex}},fg={{colors.surface_container_high.default.hex}}]"
set -g status-right "#[fg={{colors.error.default.hex}},bold]#{?client_prefix, 󰌌 PREFIX ,}#[fg={{colors.surface_container_high.default.hex}},bg={{colors.surface.default.hex}}]#[fg={{colors.on_surface.default.hex}},bg={{colors.surface_container_high.default.hex}}] 󰍛 #{cpu_percentage} #[fg={{colors.primary_container.default.hex}},bg={{colors.surface_container_high.default.hex}}]#[fg={{colors.on_primary_container.default.hex}},bg={{colors.primary_container.default.hex}},bold] 󰥔 %H:%M #[fg={{colors.primary.default.hex}},bg={{colors.primary_container.default.hex}}]#[fg={{colors.on_primary.default.hex}},bg={{colors.primary.default.hex}},bold] %a %d "

set -g window-status-separator ""
set -g window-status-format "#[fg={{colors.on_surface_variant.default.hex}},bg={{colors.surface.default.hex}}]  #I · #W#{?window_flags, #F,} "
set -g window-status-current-format "#[fg={{colors.secondary_container.default.hex}},bg={{colors.surface.default.hex}}]#[fg={{colors.on_secondary_container.default.hex}},bg={{colors.secondary_container.default.hex}},bold]  #I · #W#{?window_flags, #F,}  #[fg={{colors.secondary_container.default.hex}},bg={{colors.surface.default.hex}}]"

set -g pane-border-style "fg={{colors.outline.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"
set -g pane-border-status top
set -g pane-border-format "#[fg={{colors.on_surface_variant.default.hex}}] #{pane_index} · #{pane_current_command} "

set -g mode-style "fg={{colors.on_secondary_container.default.hex}},bg={{colors.secondary_container.default.hex}},bold"
set -g message-style "fg={{colors.on_primary.default.hex}},bg={{colors.primary.default.hex}},bold"
set -g message-command-style "fg={{colors.on_tertiary_container.default.hex}},bg={{colors.tertiary_container.default.hex}},bold"
set -g clock-mode-colour "{{colors.tertiary.default.hex}}"
set -g display-panes-colour "{{colors.outline.default.hex}}"
set -g display-panes-active-colour "{{colors.primary.default.hex}}"

set -g popup-style "fg={{colors.on_surface.default.hex}},bg={{colors.surface_container.default.hex}}"
set -g popup-border-style "fg={{colors.primary.default.hex}},bg={{colors.surface_container.default.hex}}"
set -g menu-style "fg={{colors.on_surface.default.hex}},bg={{colors.surface_container.default.hex}}"
set -g menu-selected-style "fg={{colors.on_primary.default.hex}},bg={{colors.primary.default.hex}},bold"
set -g menu-border-style "fg={{colors.outline.default.hex}},bg={{colors.surface_container.default.hex}}"

# Keep tmux-thumbs inside the same generated palette.
set -g @thumbs-bg-color "{{colors.surface.default.hex}}"
set -g @thumbs-fg-color "{{colors.on_surface.default.hex}}"
set -g @thumbs-hint-bg-color "{{colors.primary.default.hex}}"
set -g @thumbs-hint-fg-color "{{colors.on_primary.default.hex}}"
set -g @thumbs-select-bg-color "{{colors.secondary.default.hex}}"
set -g @thumbs-select-fg-color "{{colors.on_secondary.default.hex}}"
set -g @thumbs-multi-bg-color "{{colors.tertiary.default.hex}}"
set -g @thumbs-multi-fg-color "{{colors.on_tertiary.default.hex}}"
